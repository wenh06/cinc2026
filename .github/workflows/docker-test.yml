name: Docker Image CI and Test

on:
  push:
    branches: [ docker-test ]
  pull_request:
    branches: [ master ]

env:
  # see the Dockerfile for the definition of some of the following environment variables
  # Lifecycle: pre → alpha → beta → final
  status: alpha
  # Google Drive file ID for the reduced training dataset (all 780 records, CAISR EDFs +
  # demographics only, ~380 MB).  Created by create_reduced_dataset.py.
  # Set to empty string to fall back to the mini dataset (171 records, ~28 MB).
  # The reduced dataset is shared at:
  # https://drive.google.com/file/d/1FWrDFicvgmatKUcshHPCWyUfcBQR9kAJ/view?usp=sharing
  REDUCED_DATASET_GDRIVE_ID: "1FWrDFicvgmatKUcshHPCWyUfcBQR9kAJ"
  # Google Drive file ID for the mini training subset (171 records, ~28 MB CAISR EDFs only).
  # Created by create_mini_dataset.py and shared at:
  # https://drive.google.com/file/d/1KUf1c63fK0YTFwsi3irrBSaR069OYdFB/view?usp=sharing
  MINI_DATASET_GDRIVE_ID: "1KUf1c63fK0YTFwsi3irrBSaR069OYdFB"
  CINC2026_REVENGER_TEST: 1
  download_data_dir: ${{ github.workspace }}/download_data
  mount_data_dir: /challenge/data
  revenger_data_dir: /challenge/cache/revenger_data_dir
  revenger_model_cache_dir: /challenge/cache/revenger_model_dir
  revenger_model_dir: /challenge/model
  revenger_test_dir: /challenge/test
  revenger_output_dir: /challenge/output
  docker_main_filename: ActionTest.Dockerfile  # Dockerfile
  DOCKER_HUB_USERNAME: wenh06
  DOCKER_HUB_REPOSITORY: deeppsp-cinc2026-docker-image
  DOCKER_IMAGE_TAG: latest
  # host-side writable directories to bind-mount into the container
  host_output_dir: ${{ github.workspace }}/output
  host_test_dir: ${{ github.workspace }}/test
  host_model_dir: ${{ github.workspace }}/model

jobs:

  build:
    if: contains(fromJson('["wenh06", "kjs11", "DeepPSP"]'), github.repository_owner)

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Clear unnecessary system components
      run: |
        echo "Free space before cleanup:"
        df -h
        # remove large pre-installed toolchains and SDKs
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        # remove large apt packages not needed for our build
        sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' \
          'php.*' '^mongodb-.*' '^mysql-.*' \
          azure-cli google-cloud-cli google-chrome-stable \
          firefox powershell mono-devel libgl1-mesa-dri --fix-missing || true
        sudo apt-get autoremove -y || true
        sudo apt-get clean || true
        # remove docker images already pulled (we will build our own)
        docker rmi $(docker images -q) 2>/dev/null || true
        # remove swap file to reclaim space
        sudo swapoff -a || true
        sudo rm -f /mnt/swapfile || true
        echo "Free space after cleanup:"
        df -h
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver: docker
    # - name: Login to Docker Hub
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ secrets.DOCKERHUB_USERNAME }}
    #     password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push (optional) the Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ env.docker_main_filename }}
        push: false
        # load: true
        tags: |
          ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }}

    - name: Download training dataset (CAISR annotations only)
      if: ${{ env.status != 'pre' }}
      # Uses the reduced dataset (all 766 records, ~125 MB) when REDUCED_DATASET_GDRIVE_ID
      # is set; falls back to the mini dataset (171 records, ~28 MB) otherwise.
      # Both zips contain only demographics.csv + algorithmic_annotations/ (no raw PSG).
      # Created by create_reduced_dataset.py / create_mini_dataset.py respectively.
      run: |
        pip install -q gdown
        mkdir -p ${{ env.download_data_dir }}
        if [ -n "${{ env.REDUCED_DATASET_GDRIVE_ID }}" ]; then
          echo "Downloading reduced dataset (all records, CAISR only) ..."
          gdown "${{ env.REDUCED_DATASET_GDRIVE_ID }}" -O /tmp/cinc2026-dataset.zip
        else
          echo "REDUCED_DATASET_GDRIVE_ID not set — falling back to mini dataset (171 records)."
          gdown "${{ env.MINI_DATASET_GDRIVE_ID }}" -O /tmp/cinc2026-dataset.zip
        fi
        unzip -q /tmp/cinc2026-dataset.zip -d ${{ env.download_data_dir }}
        echo "=== dataset contents (first 20 files) ==="
        find ${{ env.download_data_dir }} -type f | sort | head -20
        echo "=== total files ==="
        find ${{ env.download_data_dir }} -type f | wc -l

    - name: Create writable host directories for container output
      if: ${{ env.status != 'pre' }}
      run: |
        mkdir -p ${{ env.host_output_dir }}
        mkdir -p ${{ env.host_test_dir }}
        mkdir -p ${{ env.host_model_dir }}

    - name: Run the Docker image
      # NOTE: The PhysioNet challenge evaluates submissions via Apptainer, which strips
      # Dockerfile ENV variables at runtime. For CinC2026 this is not an issue because
      # all runtime paths (model dir, output dir, etc.) are resolved programmatically in
      # team_code.py — no Dockerfile ENV vars are relied upon. Apptainer SIF conversion
      # is therefore skipped here (it requires ~17 GB extra disk on a runner that has
      # only ~34 GB free after the Docker build). Plain `docker run` correctly verifies
      # code logic under challenge-like conditions (read-only data mount, no network).
      if: ${{ env.status != 'pre' }}
      run: |
        docker run \
          -e PYTHONUNBUFFERED=1 \
          -e CINC2026_REVENGER_TEST=${{ env.CINC2026_REVENGER_TEST }} \
          -e revenger_data_dir=${{ env.revenger_data_dir }} \
          -e revenger_model_dir=${{ env.revenger_model_dir }} \
          -e revenger_test_dir=${{ env.revenger_test_dir }} \
          -e revenger_output_dir=${{ env.revenger_output_dir }} \
          -e mount_data_dir=${{ env.mount_data_dir }} \
          -v ${{ env.download_data_dir }}:${{ env.mount_data_dir }}:ro \
          -v ${{ env.host_model_dir }}:${{ env.revenger_model_dir }} \
          -v ${{ env.host_output_dir }}:${{ env.revenger_output_dir }} \
          --network none \
          ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }} \
          bash -c "bash test_run_challenge.sh"
        docker ps -a
        docker stop $(docker ps -a -q) || true
