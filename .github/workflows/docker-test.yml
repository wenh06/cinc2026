name: Docker Image CI and Test

on:
  push:
    branches: [ docker-test ]
  pull_request:
    branches: [ master ]

env:
  # see the Dockerfile for the definition of some of the following environment variables
  # Lifecycle: pre → alpha → beta → final
  status: alpha
  # Google Drive file ID for the mini training subset (171 records, ~28 MB CAISR EDFs only).
  # Created by create_mini_dataset.py and shared at:
  # https://drive.google.com/file/d/1KUf1c63fK0YTFwsi3irrBSaR069OYdFB/view?usp=sharing
  MINI_DATASET_GDRIVE_ID: "1KUf1c63fK0YTFwsi3irrBSaR069OYdFB"
  CINC2026_REVENGER_TEST: 1
  download_data_dir: ${{ github.workspace }}/download_data
  mount_data_dir: /challenge/data
  revenger_data_dir: /challenge/cache/revenger_data_dir
  revenger_model_cache_dir: /challenge/cache/revenger_model_dir
  revenger_model_dir: /challenge/model
  revenger_test_dir: /challenge/test
  revenger_output_dir: /challenge/output
  docker_main_filename: ActionTest.Dockerfile  # Dockerfile
  DOCKER_HUB_USERNAME: wenh06
  DOCKER_HUB_REPOSITORY: deeppsp-cinc2026-docker-image
  DOCKER_IMAGE_TAG: latest
  # host-side writable directories to bind-mount into the container
  host_output_dir: ${{ github.workspace }}/output
  host_test_dir: ${{ github.workspace }}/test
  host_model_dir: ${{ github.workspace }}/model

jobs:

  build:
    if: contains(fromJson('["wenh06", "kjs11", "DeepPSP"]'), github.repository_owner)

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Clear unnecessary system components
      run: |
        echo "Free space before cleanup:"
        df -h
        # remove large pre-installed toolchains and SDKs
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        # remove large apt packages not needed for our build
        sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' \
          'php.*' '^mongodb-.*' '^mysql-.*' \
          azure-cli google-cloud-cli google-chrome-stable \
          firefox powershell mono-devel libgl1-mesa-dri --fix-missing || true
        sudo apt-get autoremove -y || true
        sudo apt-get clean || true
        # remove docker images already pulled (we will build our own)
        docker rmi $(docker images -q) 2>/dev/null || true
        # remove swap file to reclaim space
        sudo swapoff -a || true
        sudo rm -f /mnt/swapfile || true
        echo "Free space after cleanup:"
        df -h
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker
    # - name: Login to Docker Hub
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ secrets.DOCKERHUB_USERNAME }}
    #     password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push (optional) the Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ env.docker_main_filename }}
        push: false
        # load: true
        tags: |
          ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }}

    - name: Install Apptainer from official PPA
      run: |
        sudo add-apt-repository -y ppa:apptainer/ppa
        sudo apt update
        sudo apt install -y apptainer
        apptainer --version

    - name: Convert Docker image to Apptainer SIF
      run: |
        # Prune BuildKit layer cache — keeps the final image but frees the
        # intermediate layer cache that accumulated during the build (~10–15 GB).
        docker builder prune --all --force || true
        echo "Free space before Apptainer conversion:"
        df -h /
        docker image inspect ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }} \
          --format='{{.Size}}'
        # APPTAINER_TMPDIR: point at the workspace disk (avoids any small /tmp tmpfs).
        mkdir -p ${{ github.workspace }}/_apptainer_tmp
        APPTAINER_TMPDIR=${{ github.workspace }}/_apptainer_tmp \
          apptainer build container.sif \
            docker-daemon://${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }}
        # Remove the Docker image now that the SIF is built (reclaim ~8.5 GB).
        docker rmi ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }} || true
        rm -rf ${{ github.workspace }}/_apptainer_tmp
        echo "Free space after SIF build:"
        df -h /

    - name: Download mini training subset (CAISR annotations only, ~28 MB)
      if: ${{ env.status != 'pre' }}
      # Downloads 171-record mini dataset (3×n per site×CI stratum, proportionally split
      # from canonical train/val) via gdown (already in requirements.txt).
      # The data directory is mounted read-only into the container in the next step,
      # matching the challenge evaluation environment.
      run: |
        pip install -q gdown
        mkdir -p ${{ env.download_data_dir }}
        gdown "${{ env.MINI_DATASET_GDRIVE_ID }}" -O /tmp/cinc2026-mini-training-set.zip
        unzip -q /tmp/cinc2026-mini-training-set.zip -d ${{ env.download_data_dir }}
        echo "=== mini dataset contents ==="
        find ${{ env.download_data_dir }} -type f | sort

    - name: Create writable host directories for container output
      if: ${{ env.status != 'pre' }}
      run: |
        mkdir -p ${{ env.host_output_dir }}
        mkdir -p ${{ env.host_test_dir }}
        mkdir -p ${{ env.host_model_dir }}

    # - name: Run the Docker image
    #   # TODO: adjust this step for CinC2026 challenge
    #   # NOTE: mount env.download_data_dir to env.mount_data_dir
    #   # and set it read-only as in the CinC2026 challenge settings.
    #   # Also, the docker image is run without any internet access.
    #   if: ${{ env.status != 'pre' }}
    #   run: |
    #     docker run \
    #       -e PYTHONUNBUFFERED=1 \
    #       -e CINC2026_REVENGER_TEST=${{ env.CINC2026_REVENGER_TEST }} \
    #       -e revenger_data_dir=${{ env.revenger_data_dir }} \
    #       -e revenger_model_dir=${{ env.revenger_model_dir }} \
    #       -e revenger_test_dir=${{ env.revenger_test_dir }} \
    #       -e revenger_output_dir=${{ env.revenger_output_dir }} \
    #       -e mount_data_dir=${{ env.mount_data_dir }} \
    #       -v ${{ env.download_data_dir }}:${{ env.mount_data_dir }}:ro \
    #       --network none \
    #       ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }} \
    #       bash -c "bash test_run_challenge.sh"
    #     docker ps -a
    #     docker stop $(docker ps -a -q)

    - name: Run the Apptainer container (replicates PhysioNet evaluation)
      if: ${{ env.status != 'pre' }}
      run: |
        apptainer exec \
          --env PYTHONUNBUFFERED=1 \
          --env CINC2026_REVENGER_TEST=${{ env.CINC2026_REVENGER_TEST }} \
          --env revenger_data_dir=${{ env.revenger_data_dir }} \
          --env revenger_model_dir=${{ env.revenger_model_dir }} \
          --env revenger_test_dir=${{ env.revenger_test_dir }} \
          --env revenger_output_dir=${{ env.revenger_output_dir }} \
          --env mount_data_dir=${{ env.mount_data_dir }} \
          --bind ${{ env.download_data_dir }}:${{ env.mount_data_dir }}:ro \
          --network none \
          container.sif \
          bash test_run_challenge.sh
